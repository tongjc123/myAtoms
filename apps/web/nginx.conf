server {
    listen 80;
    server_name _;

    # Built SPA assets.
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown non-asset paths serve index.html so the React router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed build assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API and health checks proxy to the backend container.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (generation step log) streams; disable buffering so events arrive live.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /actuator/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
